<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Arquivos | Dashboard</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --soft-green: #dcfce7;
      --soft-blue: #dbeafe;
      --soft-yellow: #fef9c3;
      --soft-red: #fee2e2;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 250px 1fr;
      height: 100vh;
    }

    .sidebar {
      background: #0f172a;
      color: #fff;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #14b8a6, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
    }

    .brand h1 {
      font-size: 17px;
      line-height: 1.2;
    }

    .brand span {
      font-size: 12px;
      color: #94a3b8;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .nav button.active,
    .nav button:hover {
      background: rgba(20, 184, 166, 0.16);
      color: #fff;
    }

    .sidebar-footer {
      margin-top: auto;
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
    }

    .main {
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    .topbar {
      height: 72px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .topbar-title h2 {
      font-size: 21px;
      margin-bottom: 4px;
    }

    .topbar-title p {
      color: var(--muted);
      font-size: 13px;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search {
      width: 300px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0 16px;
      outline: none;
      background: #f8fafc;
    }

    .btn {
      height: 40px;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-light {
      background: #f1f5f9;
      color: #334155;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 20px 28px;
    }

    .metric-card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .metric-card small {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-card strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
    }

    .metric-card span {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--primary-dark);
      background: #ccfbf1;
      padding: 5px 8px;
      border-radius: 999px;
    }

    .content {
      padding: 0 28px 28px;
      overflow-y: auto;
    }

    .table-container {
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.9);
      overflow: hidden;
    }

    .table-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-header h3 {
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table thead {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    table th {
      padding: 12px 20px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    table td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    table tbody tr:hover {
      background: #f8fafc;
    }

    .badge {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
    }

    .badge.green {
      background: var(--soft-green);
      color: #166534;
    }

    .badge.blue {
      background: var(--soft-blue);
      color: #1d4ed8;
    }

    .badge.yellow {
      background: var(--soft-yellow);
      color: #854d0e;
    }

    .badge.red {
      background: var(--soft-red);
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: var(--soft-red);
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 16px;
      border-radius: 12px;
      margin: 20px;
    }

    @media (max-width: 1024px) {
      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px;
      }

      .topbar-actions {
        width: 100%;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }

      table th,
      table td {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">M</div>
        <div>
          <h1>Meus<br/>Arquivos</h1>
          <span>Google Sheets</span>
        </div>
      </div>

      <nav class="nav">
        <button class="active" onclick="showTab('pessoas')">Pessoas</button>
        <button onclick="showTab('livros')">Livros</button>
        <button onclick="showTab('dados')">Todos os Dados</button>
      </nav>

      <div class="sidebar-footer">
        Conectado ao Google Sheets.<br />
        ID: 1vOlvmsj65CKsqRqj1EftY4z...
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2 id="pageTitle">Dashboard de Dados</h2>
          <p id="pageDesc">Visualize os dados sincronizados do Google Sheets</p>
        </div>
        <div class="topbar-actions">
          <input class="search" type="text" id="searchInput" placeholder="Buscar dados..." />
          <button class="btn btn-light" onclick="reloadData()">Atualizar</button>
        </div>
      </header>

      <section class="metrics" id="metricsContainer"></section>

      <section class="content">
        <div class="table-container">
          <div class="table-header">
            <h3 id="tableTitle">Pessoas</h3>
          </div>
          <div id="tableContent" class="loading">
            <div class="spinner"></div>
            <p>Carregando dados...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let allData = {
      pessoas: [],
      livros: [],
      rawData: []
    };
    let currentTab = 'pessoas';

    async function loadData() {
      try {
        const [pessoasRes, livrosRes] = await Promise.all([
          fetch('/api/pessoas'),
          fetch('/api/livros')
        ]);

        if (pessoasRes.ok) {
          allData.pessoas = await pessoasRes.json();
        }
        if (livrosRes.ok) {
          allData.livros = await livrosRes.json();
        }
      } catch (error) {
        console.warn('Erro ao carregar dados da API:', error);
      }
    }

    async function initializeData() {
      await loadData();
      renderMetrics();
      showTab('pessoas');
    }

    function renderMetrics() {
      const container = document.getElementById('metricsContainer');
      const metrics = [
        { label: 'Total de Pessoas', value: allData.pessoas.length, color: 'green' },
        { label: 'Total de Livros', value: allData.livros.length, color: 'blue' },
        { label: 'Idade Média', value: (allData.pessoas.reduce((a, b) => a + b.idade, 0) / allData.pessoas.length || 0).toFixed(1), color: 'yellow' },
        { label: 'Páginas Totais', value: allData.livros.reduce((a, b) => a + b.totalPaginas, 0), color: 'red' }
      ];

      container.innerHTML = metrics.map(m => `
        <div class="metric-card">
          <small>${m.label}</small>
          <strong>${m.value}</strong>
          <span class="badge ${m.color}"></span>
        </div>
      `).join('');
    }

    function renderTable(data, columns) {
      if (data.length === 0) {
        return '<p style="padding: 20px; text-align: center; color: var(--muted);">Nenhum dado disponível</p>';
      }

      const headerRow = columns.map(col => `<th>${col}</th>`).join('');
      const bodyRows = data.map(row => {
        const cellsHtml = columns.map(col => {
          const value = row[col] || '-';
          return `<td>${value}</td>`;
        }).join('');
        return `<tr>${cellsHtml}</tr>`;
      }).join('');

      return `
        <table>
          <thead>
            <tr>${headerRow}</tr>
          </thead>
          <tbody>
            ${bodyRows}
          </tbody>
        </table>
      `;
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav button').forEach((btn, idx) => {
        btn.classList.toggle('active',
          (idx === 0 && tab === 'pessoas') ||
          (idx === 1 && tab === 'livros') ||
          (idx === 2 && tab === 'dados')
        );
      });

      const tableContent = document.getElementById('tableContent');
      const tableTitle = document.getElementById('tableTitle');
      const pageTitle = document.getElementById('pageTitle');
      const pageDesc = document.getElementById('pageDesc');

      switch(tab) {
        case 'pessoas':
          pageTitle.textContent = 'Pessoas';
          pageDesc.textContent = 'Visualize a lista de pessoas cadastradas';
          tableTitle.textContent = 'Pessoas';
          tableContent.innerHTML = renderTable(allData.pessoas, ['nome', 'idade', 'sexo']);
          break;
        case 'livros':
          pageTitle.textContent = 'Livros';
          pageDesc.textContent = 'Visualize a lista de livros cadastrados';
          tableTitle.textContent = 'Livros';
          tableContent.innerHTML = renderTable(allData.livros, ['titulo', 'autor', 'totalPaginas']);
          break;
        case 'dados':
          pageTitle.textContent = 'Todos os Dados';
          pageDesc.textContent = 'Dados brutos do Google Sheets';
          tableTitle.textContent = 'Dados Completos';
          const allDataRows = [...allData.pessoas.map(p => ({...p, tipo: 'Pessoa'})),
                               ...allData.livros.map(l => ({...l, tipo: 'Livro'}))];
          tableContent.innerHTML = renderTable(allDataRows, ['tipo', 'nome', 'titulo', 'idade', 'autor']);
          break;
      }
    }

    function reloadData() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Atualizando...';

      // TODO: Chamar API real para recarregar dados
      setTimeout(() => {
        initializeData();
        btn.disabled = false;
        btn.textContent = 'Atualizar';
      }, 1000);
    }

    // Inicializar ao carregar
    document.addEventListener('DOMContentLoaded', initializeData);

    // Busca
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const search = e.target.value.toLowerCase();
      const currentData = currentTab === 'pessoas' ? allData.pessoas : allData.livros;

      const filtered = currentData.filter(item => {
        return JSON.stringify(item).toLowerCase().includes(search);
      });

      const columns = currentTab === 'pessoas' ? ['nome', 'idade', 'sexo'] : ['titulo', 'autor', 'totalPaginas'];
      document.getElementById('tableContent').innerHTML = renderTable(filtered, columns);
    });
  </script>
</body>
</html>
