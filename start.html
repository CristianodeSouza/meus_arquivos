<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreador Arquitetônico</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 18px 48px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    .features {
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      margin-top: 40px;
      line-height: 2;
    }

    .feature-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📐</div>
    <h1>Projeto Arquitetônico</h1>
    <p>Acompanhe o progresso do seu projeto em um só lugar</p>

    <a href="app-arquiteto.html" class="btn">
      ▶️ ABRIR APP
    </a>

    <div class="features">
      <div class="feature-item">✓ Dashboard com progresso</div>
      <div class="feature-item">✓ Gerenciar atividades</div>
      <div class="feature-item">✓ Armazenar documentos</div>
      <div class="feature-item">✓ Timeline de eventos</div>
      <div class="feature-item">✓ Contatar arquitetos</div>
    </div>
  </div>
</body>
</html>
